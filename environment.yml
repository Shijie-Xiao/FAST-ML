name: fast_ml
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch>=2.0
  # Drop the two lines below for a CPU-only install; inference works on CPU,
  # it is just slower (1-2 min per storm instead of a few seconds).
  - pytorch-cuda=12.4
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - xarray>=2023.1
  - netcdf4>=1.6
  - matplotlib>=3.7
  - einops>=0.6
  - pip
  - pip:
      # Only needed by scripts/download_data.py for Google Drive hosted files.
      - gdown>=4.7
